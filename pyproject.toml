[project]
name = "sharectl-edition"
version = "0.1.0"
description = "Your own bot edits your personal morning paper."
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools]
packages = ["sharectl_edition", "sharectl_edition.fetch", "sharectl_edition.render", "sharectl_edition.publish"]

[tool.setuptools.package-data]
"sharectl_edition.render" = ["edition.css"]
